<header class="app-header">
  <div class="logo" aria-hidden="true">D</div>
  <h1 class="header-title">Misiones <em>Repetibles</em></h1>
  <div class="header-right">
    <div class="global-progress-wrap">
      <mat-progress-bar
        class="global-progress-bar"
        mode="determinate"
        [value]="stats.overallProgress().completionPercentage"
        aria-label="Progreso global de misiones"
      />
      <span class="global-pct">{{ stats.overallProgress().completionPercentage }}%</span>
    </div>
  </div>
</header>

<router-outlet />
